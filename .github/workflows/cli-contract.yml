name: CLI contract (weekly)

# Re-runs the provider contract tests (they only parse recorded fixtures) and reports whether the newest Claude Code
# and Codex releases are outside the tested range. Only `--version` is run: no login, no model calls, no quota.
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/cli-versions.ts --latest
      - run: pnpm vitest run --project providers
